<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK Cabs | Booking</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }
    header {
      background: #101827;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; color: #ffc928; }
    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 12px;
    }
    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000012;
    }
    h2 { margin-top: 0; font-size: 20px; }
    label {
      display: block;
      font-weight: bold;
      margin: 13px 0 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd2dc;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }
    .suggestions {
      border: 1px solid #cbd2dc;
      border-top: 0;
      border-radius: 0 0 7px 7px;
      max-height: 190px;
      overflow-y: auto;
      display: none;
      background: white;
    }
    .suggestion {
      padding: 11px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      font-size: 14px;
    }
    .suggestion:hover { background: #eef4ff; }
    #map {
      width: 100%;
      height: 300px;
      border-radius: 9px;
      margin-top: 14px;
    }
    .summary {
      background: #f7f9fc;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.8;
    }
    .total {
      font-size: 23px;
      font-weight: bold;
      color: #087443;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    #whatsappBtn { background: #25d366; color: white; }
    #status { font-size: 14px; color: #555; margin-top: 8px; }
    .small { font-size: 13px; color: #667085; }
  </style>
</head>

<body>
<header>
  <h1>RK Cabs</h1>
  <div>Safe • Comfortable • Reliable</div>
</header>

<main>
  <section class="card">
    <h2>Trip Details</h2>

    <label for="tripType">Trip Type</label>
    <select id="tripType">
      <option value="oneway">One Way Drop</option>
      <option value="round">Round Trip</option>
    </select>

    <label for="pickup">Pickup Location</label>
    <input id="pickup" placeholder="Type pickup location" autocomplete="off">
    <div id="pickupSuggestions" class="suggestions"></div>

    <label for="destination">Destination</label>
    <input id="destination" placeholder="Type destination" autocomplete="off">
    <div id="destinationSuggestions" class="suggestions"></div>

    <label for="pickupDate">Pickup Date</label>
    <input id="pickupDate" type="date">

    <div id="returnDateWrap" style="display:none">
      <label for="returnDate">Return Date</label>
      <input id="returnDate" type="date">
    </div>

    <label for="pickupTime">Pickup Time</label>
    <input id="pickupTime" type="time">

    <label for="vehicle">Vehicle</label>
    <select id="vehicle">
      <option value="sedan">Sedan</option>
      <option value="suv">SUV (Ertiga)</option>
      <option value="suvplus">SUV Plus</option>
    </select>

    <label for="passengers">Passengers</label>
    <input id="passengers" type="number" min="1" value="1">

    <label for="customer">Customer Name</label>
    <input id="customer" placeholder="Enter customer name">

    <label for="mobile">Mobile Number</label>
    <input id="mobile" type="tel" placeholder="Enter mobile number">

    <label for="pets">Pets</label>
    <select id="pets">
      <option value="no">No</option>
      <option value="yes">Yes (+₹500)</option>
    </select>

    <div id="status">Pickup மற்றும் destination இடங்களைத் தேர்வு செய்யுங்கள்.</div>
    <div id="map"></div>
  </section>

  <section class="card">
    <h2>Fare Estimate</h2>
    <div class="summary">
      <div>Route distance: <strong id="routeKm">—</strong></div>
      <div>Chargeable distance: <strong id="chargeKm">—</strong></div>
      <div>Trip days: <strong id="tripDays">—</strong></div>
      <div>Driver bata: <strong id="driverBata">—</strong></div>
      <div>Estimated fare: <span class="total" id="totalFare">—</span></div>
      <div class="small">Toll, parking, permit charges (if applicable) are extra.</div>
    </div>
    <button id="whatsappBtn">Book via WhatsApp</button>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // RK Cabs settings
  const WHATSAPP_NUMBER = "916384253864";

  const rates = {
    sedan:   { perKm: 15, minOneWay: 130, minPerDay: 250, bata: 400 },
    suv:     { perKm: 20, minOneWay: 130, minPerDay: 250, bata: 400 },
    suvplus: { perKm: 22, minOneWay: 130, minPerDay: 250, bata: 500 }
  };

  const pickupInput = document.getElementById("pickup");
  const destinationInput = document.getElementById("destination");
  const statusEl = document.getElementById("status");

  let pickupPlace = null;
  let destinationPlace = null;
  let routeLayer = null;
  let routeKm = null;
  let searchTimers = {};

  const map = L.map("map").setView([11.0168, 76.9558], 7);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function setupAutocomplete(input, box, type) {
    input.addEventListener("input", () => {
      clearTimeout(searchTimers[type]);

      const query = input.value.trim();
      if (query.length < 3) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }

      searchTimers[type] = setTimeout(async () => {
        try {
          const url =
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=in&q=" +
            encodeURIComponent(query);

          const response = await fetch(url);
          const results = await response.json();

          box.innerHTML = "";
          if (!results.length) {
            box.style.display = "none";
            return;
          }

          results.forEach(place => {
            const item = document.createElement("div");
            item.className = "suggestion";
            item.textContent = place.display_name;

            item.addEventListener("click", () => {
              input.value = place.display_name;

              const selected = {
                name: place.display_name,
                lat: Number(place.lat),
                lon: Number(place.lon)
              };

              if (type === "pickup") pickupPlace = selected;
              else destinationPlace = selected;

              box.style.display = "none";
              box.innerHTML = "";
              calculateRoute();
            });

            box.appendChild(item);
          });

          box.style.display = "block";
        } catch (error) {
          setStatus("Location search முடியவில்லை. மீண்டும் முயற்சி செய்யுங்கள்.");
        }
      }, 600);
    });

    document.addEventListener("click", event => {
      if (event.target !== input && !box.contains(event.target)) {
        box.style.display = "none";
      }
    });
  }

  setupAutocomplete(
    pickupInput,
    document.getElementById("pickupSuggestions"),
    "pickup"
  );

  setupAutocomplete(
    destinationInput,
    document.getElementById("destinationSuggestions"),
    "destination"
  );

  async function calculateRoute() {
    routeKm = null;
    document.getElementById("routeKm").textContent = "—";
    document.getElementById("chargeKm").textContent = "—";
    document.getElementById("totalFare").textContent = "—";

    if (!pickupPlace || !destinationPlace) {
      setStatus("Pickup மற்றும் destination suggestions-லிருந்து இடங்களைத் தேர்வு செய்யுங்கள்.");
      updateFare();
      return;
    }

    setStatus("Route கணக்கிடுகிறது…");

    try {
      const url =
        `https://router.project-osrm.org/route/v1/driving/` +
        `${pickupPlace.lon},${pickupPlace.lat};` +
        `${destinationPlace.lon},${destinationPlace.lat}` +
        `?overview=full&geometries=geojson`;

      const response = await fetch(url);
      const data = await response.json();

      if (!data.routes || !data.routes.length) {
        setStatus("இந்த இடங்களுக்கு route கிடைக்கவில்லை.");
        return;
      }

      const route = data.routes[0];
      routeKm = route.distance / 1000;

      if (routeLayer) map.removeLayer(routeLayer);

      routeLayer = L.geoJSON(route.geometry, {
        style: { color: "#1769ff", weight: 5 }
      }).addTo(map);

      const bounds = routeLayer.getBounds();
      map.fitBounds(bounds, { padding: [25, 25] });

      document.getElementById("routeKm").textContent =
        routeKm.toFixed(1) + " km";

      setStatus("Route மற்றும் kilometre கணக்கிடப்பட்டது.");
      updateFare();
    } catch (error) {
      setStatus("Route கணக்கிட முடியவில்லை. சிறிது நேரம் கழித்து முயற்சி செய்யுங்கள்.");
    }
  }

  function getTripDays() {
    if (document.getElementById("tripType").value === "oneway") return 1;

    const start = document.getElementById("pickupDate").value;
    const end = document.getElementById("returnDate").value;

    if (!start || !end) return 1;

    const startDate = new Date(start + "T00:00:00");
    const endDate = new Date(end + "T00:00:00");

    const difference = Math.round((endDate - startDate) / 86400000);
    return difference >= 0 ? difference + 1 : 1;
  }

  function updateFare() {
    const tripType = document.getElementById("tripType").value;
    const vehicle = document.getElementById("vehicle").value;
    const petCharge = document.getElementById("pets").value === "yes" ? 500 : 0;
    const setting = rates[vehicle];
    const days = getTripDays();

    document.getElementById("tripDays").textContent =
      tripType === "round" ? days : "1";

    document.getElementById("driverBata").textContent =
      "₹" + (setting.bata * (tripType === "round" ? days : 1));

    if (routeKm === null) {
      document.getElementById("chargeKm").textContent = "—";
      document.getElementById("totalFare").textContent = "—";
      return;
    }

    let chargeableKm;
    let fare;

    if (tripType === "oneway") {
      chargeableKm = Math.max(routeKm, setting.minOneWay);
      fare = chargeableKm * setting.perKm;
    } else {
      const roundDistance = routeKm * 2;
      const minimumDistance = setting.minPerDay * days;
      chargeableKm = Math.max(roundDistance, minimumDistance);
      fare = chargeableKm * setting.perKm;
    }

    const bata = setting.bata * (tripType === "round" ? days : 1);
    const total = fare + bata + petCharge;

    document.getElementById("chargeKm").textContent =
      chargeableKm.toFixed(1) + " km";

    document.getElementById("totalFare").textContent =
      "₹" + Math.round(total).toLocaleString("en-IN");
  }

  document.getElementById("tripType").addEventListener("change", () => {
    const isRound = document.getElementById("tripType").value === "round";
    document.getElementById("returnDateWrap").style.display = isRound ? "block" : "none";
    updateFare();
  });

  ["vehicle", "pets", "pickupDate", "returnDate"].forEach(id => {
    document.getElementById(id).addEventListener("change", updateFare);
  });

  document.getElementById("whatsappBtn").addEventListener("click", () => {
    const customer = document.getElementById("customer").value.trim();
    const mobile = document.getElementById("mobile").value.trim();

    if (!customer || !mobile) {
      alert("Customer name மற்றும் mobile number உள்ளிடுங்கள்.");
      return;
    }

    if (!pickupPlace || !destinationPlace || routeKm === null) {
      alert("Pickup மற்றும் destination இடங்களைத் தேர்வு செய்து route கணக்கிடுங்கள்.");
      return;
    }

    const tripType = document.getElementById("tripType").value;
    const vehicle = document.getElementById("vehicle").selectedOptions[0].text;
    const pickupDate = document.getElementById("pickupDate").value || "Not selected";
    const returnDate = document.getElementById("returnDate").value || "Not applicable";
    const pickupTime = document.getElementById("pickupTime").value || "Not selected";

    const message =
      `RK Cabs Booking Request%0A` +
      `Customer: ${customer}%0A` +
      `Mobile: ${mobile}%0A` +
      `Trip: ${tripType === "round" ? "Round Trip" : "One Way Drop"}%0A` +
      `Pickup: ${pickupPlace.name}%0A` +
      `Destination: ${destinationPlace.name}%0A` +
      `Pickup Date: ${pickupDate}%0A` +
      `Return Date: ${returnDate}%0A` +
      `Pickup Time: ${pickupTime}%0A` +
      `Vehicle: ${vehicle}%0A` +
      `Route Distance: ${routeKm.toFixed(1)} km%0A` +
      `Estimated Fare: ${document.getElementById("totalFare").textContent}`;

    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, "_blank");
  });

  // Default pickup date = today
  const today = new Date();
  const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
    .toISOString().split("T")[0];

  document.getElementById("pickupDate").value = localDate;
  document.getElementById("returnDate").min = localDate;

  document.getElementById("pickupDate").addEventListener("change", () => {
    document.getElementById("returnDate").min =
      document.getElementById("pickupDate").value;
  });
</script>
</body>
</html>
